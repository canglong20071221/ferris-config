# --- BLUETOOTH & CONNECTION STABILITY ---
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# 1. Boost Signal: Helps signal penetrate through the laptop chassis/interference
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2. Modern ZMK Windows/AMD Fix
# This experimental flag uses a better Bluetooth connection parameter update 
# mechanism that prevents Windows/AMD drivers from dropping the board, 
# allowing us to keep the fast 7.5ms polling rate required for 100 WPM.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 3. Disable High Speed (Optional Fallback)
# Keep this disabled (n) as it helps older AMD cards, but you can safely remove 
# this line entirely if EXPERIMENTAL_CONN (above) fixes your drops.
CONFIG_BT_CTLR_PHY_2M=n

# --- BATTERY ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=180
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- POWER MANAGEMENT ---
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Enter deep sleep after 1 hour (3600000 ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# --- MOUSE ---
CONFIG_ZMK_POINTING=y

# --- COMBOS & BEHAVIORS ---
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=20
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# Optimized Queue Size
# 512 is overkill and wastes SRAM on smaller microcontrollers. 
# 256 is still 4x the ZMK default and easily handles massive typing bursts.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256

# --- ZMK STUDIO ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=300

# --- SYSTEM ---
# Name must be exactly 15 characters or less (16 bytes including null terminator)
CONFIG_ZMK_KEYBOARD_NAME="sweep split kbd"
